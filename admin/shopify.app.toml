# Shopify app configuration. `npm run config:link` fills in client_id and application_url
# from the Partners dashboard; `npm run deploy` pushes scopes and webhooks back to Shopify.

# Mirrors the released app version in the Dev Dashboard (admin-app-1.1). The app is named
# "Blankd" there; keep that name here or a CLI deploy will rename it.
name = "Blankd"
client_id = "18311dc71cc6c814f5fad5cb497984d8"
application_url = "https://piobox-customizer-admin.vercel.app"
embedded = true

[auth]
redirect_urls = ["https://piobox-customizer-admin.vercel.app/auth/callback"]

[access_scopes]
# read_orders: list orders and their line-item properties (the design ids).
# read_customers: name/email/phone on the order detail.
# read_products/write_products: read a blank's images, options and variants, and write its
#   piobox.customizer metafield from the Blanks screen.
scopes = "read_orders,read_customers,read_products,write_products"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"
